name: Deploy Web Production to Hosting

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Ferozo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci || npm install

      - name: 🔨 Compilar Angular en Producción
        run: npm run build:prod

      - name: 🚀 Sincronizar dist/ al Servidor (Ferozo)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.SFTP_USERNAME || 'c2632100' }},${{ secrets.SFTP_PASSWORD }}" -p 21 ${{ secrets.SFTP_SERVER || 'c2632100.ferozo.com' }} << 'EOF'
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data no
          set ssl:verify-certificate no
          set net:timeout 60
          set net:max-retries 3
          mirror -R --verbose ./dist/ /public_html/
          quit
          EOF
