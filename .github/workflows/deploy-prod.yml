name: Deploy Web Production to Hosting

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Ferozo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci || npm install

      - name: 🔨 Compilar Angular en Producción
        run: npm run build:prod

      - name: 🚀 Sincronizar dist/ al Servidor (Ferozo)
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER || 'c2632100.ferozo.com' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || 'c2632100' }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: 21
          SFTP_REMOTE_DIR: /public_html/
        run: |
          python3 deploy_ferozo.py
