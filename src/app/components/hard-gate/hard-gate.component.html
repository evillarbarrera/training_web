<div class="hard-gate-overlay animate-in" *ngIf="isLocked">
    <div class="gate-modal card-pm">
        <div class="modal-content">
            <div class="icon-header">💎</div>
            <h2 class="modal-title">Periodo de Prueba Finalizado</h2>
            <p class="modal-desc" [innerHTML]="message || 'Tu periodo de prueba de 90 días ha finalizado. Realiza el pago de tu suscripción mensual para continuar con el servicio.'"></p>
            <div class="btn-container mt-5">
                <button class="btn-activate btn-glow" (click)="goToPlans()">
                    {{ isClub ? 'ACTIVAR PLAN DE CLUB ($49.990 CLP)' : 'VER PLANES Y ACTIVAR SERVICIO' }}
                </button>
            </div>
            <p class="footer-note">Podrás cancelar o gestionar tu suscripción en cualquier momento.</p>
        </div>
    </div>
</div>
