<div class="login-container">
    <div class="login-card">
        <div class="header-box">
            <div class="logo">
                <img src="assets/images/logo-circular.png" class="logo-img" alt="PadelBlox" />
                <span class="logo-text">Padel<span class="accent">Blox</span></span>
            </div>
            <h2>Nueva Contraseña</h2>
            <p class="subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta</p>
        </div>

        <!-- Reset Form -->
        <div class="form-box">
            <div class="input-group">
                <label>Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" [(ngModel)]="password">
                    <span class="toggle-password" (click)="togglePasswordVisibility()">
                        {{ showPassword ? '👁️' : '🔒' }}
                    </span>
                </div>
            </div>

            <div class="input-group">
                <label>Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
                        [(ngModel)]="confirmPassword">
                    <span class="toggle-password" (click)="togglePasswordVisibility()">
                        {{ showPassword ? '👁️' : '🔒' }}
                    </span>
                </div>
            </div>

            <button class="btn-login" (click)="resetPassword()" [disabled]="isLoading">
                <span *ngIf="!isLoading">Actualizar Contraseña</span>
                <span *ngIf="isLoading" class="spinner"></span>
            </button>

            <div class="register-prompt">
                <a routerLink="/login">Volver al inicio de sesión</a>
            </div>
        </div>

        <div class="footer-links">
            <a href="#">Privacidad</a>
            <a href="#">Términos</a>
        </div>
    </div>
</div>
